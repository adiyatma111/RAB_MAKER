<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLN RAB Generator - Modern Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-modern-app {
            background-color: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .no-arrow {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: none !important;
        }

        /* Stylize input date icon for dark mode */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* DOKUMEN CETAK PRESISI A4 PAS */
        .print-page {
            width: 210mm;
            min-height: 285mm;
            padding: 8mm 12mm;
            box-sizing: border-box;
            background-color: #ffffff !important;
            color: #000000 !important;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @page {
            size: A4 portrait;
            margin: 0mm;
        }

        /* FIX MUTLAK ANTI BLANK PAGE PADA MODUS PRINT */
        @media print {
            .no-print { 
                display: none !important; 
            }
            html, body {
                width: 210mm !important;
                height: auto !important;
                background: #ffffff !important; 
                font-size: 8pt !important; 
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .mobile-scroll-wrapper {
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
            .print-page { 
                box-shadow: none !important; 
                margin: 0 !important; 
                width: 210mm !important; 
                height: 287mm !important; 
                max-height: 287mm !important;
                padding: 8mm 12mm !important; 
                border-radius: 0 !important;
                border: none !important;
                page-break-before: auto !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                overflow: hidden !important;
            }
            .print-page:last-child {
                page-break-after: avoid !important;
                page-break-after: auto !important;
            }
            div:empty {
                display: none !important;
            }
        }

        .pln-table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
        }

        .pln-table th, .pln-table td {
            border: 1px solid #000000 !important;
            padding: 4px 3px;
            vertical-align: middle;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: 8.5px;
            line-height: 1.2;
            color: #000000 !important;
        }

        .pln-table th {
            background-color: #f1f5f9 !important;
            font-weight: 700;
            text-align: center;
        }

        .pln-table input, .pln-table select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            outline: none;
            background: #f8fafc;
            font-size: inherit;
            font-family: inherit;
            color: #000000 !important;
            padding: 1px 1px;
            margin: 0;
            border-radius: 3px;
        }

        .pln-table input:focus, .pln-table select:focus {
            background-color: #e0f2fe;
            border-color: #0284c7;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-modern-app text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-slate-950">

    <header class="no-print bg-slate-950/80 backdrop-blur-md border-b border-slate-800 px-4 sm:px-6 py-3.5 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3">
                    <div class="bg-white p-1 rounded-xl shadow-md flex items-center justify-center ring-1 ring-white/10 shrink-0">
                        <svg class="h-7 sm:h-8 w-auto" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                            <rect width="300" height="300" fill="#FFF200"/>
                            <path d="M50 120 C 80 100, 120 140, 150 120 C 180 100, 220 140, 250 120 L 250 140 C 220 160, 180 120, 150 140 C 120 160, 80 120, 50 140 Z" fill="#00AEEF"/>
                            <path d="M50 160 C 80 140, 120 180, 150 160 C 180 140, 220 180, 250 160 L 250 180 C 220 200, 180 160, 150 180 C 120 200, 80 160, 50 180 Z" fill="#00AEEF"/>
                            <path d="M50 200 C 80 180, 120 220, 150 200 C 180 180, 220 220, 250 200 L 250 220 C 220 240, 180 200, 150 220 C 120 240, 80 200, 50 220 Z" fill="#00AEEF"/>
                            <polygon points="170,50 120,160 170,140 130,260 210,120 160,135" fill="#ED1C24"/>
                            <text x="150" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#00AEEF" text-anchor="middle">PLN</text>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h1 class="text-sm sm:text-base font-bold text-white tracking-tight">
                                RAB Generator
                            </h1>
                            <span class="text-[9px] font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2 py-0.5 rounded-full">v3.5 Pro</span>
                        </div>
                        <p class="text-[10px] sm:text-xs text-slate-400 font-medium">PT. PLN (Persero) UID Jatim - UP3 Malang</p>
                    </div>
                </div>

                <button onclick="togglePanduanModal(true)" class="md:hidden bg-slate-800 text-amber-400 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold active:scale-95 shadow-sm">
                    📖 Panduan
                </button>
            </div>

            <div class="flex flex-wrap items-center justify-end gap-2 w-full md:w-auto">
                <button onclick="togglePanduanModal(true)" class="hidden md:flex bg-slate-900 hover:bg-slate-800 text-amber-400 border border-slate-800 font-semibold text-xs px-3.5 py-2 rounded-xl transition items-center gap-1.5 shadow-sm">
                    <span>📖</span> Panduan
                </button>

                <button onclick="resetToBlank()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 font-semibold text-xs px-3 py-2 rounded-xl transition flex items-center gap-1 active:scale-95">
                    <span>🧹</span> Reset
                </button>

                <button onclick="cetakPrint()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition shadow-lg shadow-sky-500/20 flex items-center gap-1.5 active:scale-95">
                    <span>📄</span> Extract
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto my-6 px-3 sm:px-4">

        <section class="no-print bg-slate-900/60 backdrop-blur-xl p-5 sm:p-6 rounded-3xl border border-slate-800/80 mb-6 shadow-xl space-y-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 bg-sky-400 rounded-full animate-pulse ring-4 ring-sky-400/20"></span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-sky-400">1. Informasi Dokumen & Survey Lapangan</h2>
                </div>
                
                <div class="flex items-center gap-2">
                    <label for="selectPPN" class="text-[11px] font-bold text-slate-400">PAJAK PPN:</label>
                    <select id="selectPPN" onchange="calculateTotal(); saveToLocalStorage();" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-sky-400 focus:border-sky-500 focus:outline-none cursor-pointer">
                        <option value="0.11" selected>PPN 11%</option>
                        <option value="0.12">PPN 12%</option>
                        <option value="0">Tanpa PPN (0%)</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5">
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Nama Pemohon PB/PD</label>
                    <input type="text" id="inNama" value="" placeholder="Contoh: TAN PEK TJIANG ALT 2" oninput="syncData()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:border-sky-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Lokasi Pekerjaan</label>
                    <input type="text" id="inLokasi" value="" placeholder="Contoh: JL. MAWAR NO. 35 MALANG" oninput="syncData()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:border-sky-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">ULP</label>
                    <input type="text" id="inULP" value="MALANG KOTA" oninput="syncData()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:border-sky-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Tanggal Dokumen (Pilih Kalender)</label>
                    <input type="date" id="inTanggal" onchange="syncData()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:border-sky-500 focus:outline-none transition cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Assistant Manager Perencanaan</label>
                    <input type="text" id="inAsman" value="BAYU KRISTANTO" oninput="syncData()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:border-sky-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-300 mb-1">Team Leader Perencanaan</label>
                    <input type="text" id="inTL" value="ARDY NURFIANTO" oninput="syncData()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:border-sky-500 focus:outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2 border-t border-slate-800/60">
                <div>
                    <label class="block text-[11px] font-medium text-amber-400 mb-1">✍️ TTD Asman Perencanaan (.PNG Transparan)</label>
                    <input type="file" id="imgAsmanTTD" accept="image/png, image/jpeg" onchange="previewTTD(event, 'outTTDAsmanImg')" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-slate-800 file:text-amber-400 hover:file:bg-slate-700">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-amber-400 mb-1">✍️ TTD Team Leader Perencanaan (.PNG Transparan)</label>
                    <input type="file" id="imgTLTTD" accept="image/png, image/jpeg" onchange="previewTTD(event, 'outTTDTLImg')" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-slate-800 file:text-amber-400 hover:file:bg-slate-700">
                </div>
            </div>

            <hr class="border-slate-800/80">

            <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                <button onclick="addManualRow()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition border border-slate-700 flex items-center justify-center gap-1.5 active:scale-95">
                    <span>✏️</span> Tambah Baris Manual
                </button>

                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="selectKategori" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:border-sky-500 focus:outline-none cursor-pointer shrink-0 font-semibold">
                        <option value="SUTM">SUTM</option>
                        <option value="SKUTM">SKUTM</option>
                        <option value="GTT">GTT</option>
                        <option value="SUTR">SUTR</option>
                    </select>
                    <select id="selectMaterial" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white w-full sm:w-80 focus:border-sky-500 focus:outline-none cursor-pointer truncate">
                    </select>
                    <button onclick="addItemFromSelect()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-lg shadow-sky-500/20 active:scale-95 shrink-0">
                        + Tambahkan
                    </button>
                </div>
            </div>
        </section>

        <div id="pdfArea" class="mobile-scroll-wrapper w-full overflow-x-auto pb-6">
            <div class="inline-block min-w-full flex flex-col items-center">
                
                <div id="rekapPagesContainer" class="w-full flex flex-col items-center">
                </div>

                <div id="rincianPagesContainer" class="w-full flex flex-col items-center">
                </div>

            </div>
        </div>
    </main>

    <script>
        let masterKatalog = [
            { kode: "251", uraian: "NFA2XSEY-T 3x150 1x95 mm2 - CWS", sat: "M", hMat: 263250, hJasa: 45195 },
            { kode: "149", uraian: "Earthing Rod 16 mm - 2.5 m clamp-TM", sat: "S", hMat: 260904, hJasa: 53347 },
            { kode: "180", uraian: "Galvanized Steel Wire 35 mm-HDG", sat: "M", hMat: 21700, hJasa: 3455 },
            { kode: "492", uraian: "Tiang Beton 13m - 350 daN", sat: "B", hMat: 5603340, hJasa: 931040 },
            { kode: "376", uraian: "Polymer Arrester 24 kV - 10 KA", sat: "S", hMat: 676300, hJasa: 30130 },
            { kode: "20",  uraian: "BC 50 MM (Bare Conductor)", sat: "M", hMat: 96459, hJasa: 3731 }
        ];

        let activeItems = [];
        let isPrintMode = false;
        let ttdAsmanData = "";
        let ttdTLData = "";

        // Function Helper Format Tanggal Indonesia
        function getFormattedIndonesianDate(dateString) {
            if (!dateString) return "";
            const dateObj = new Date(dateString);
            if (isNaN(dateObj.getTime())) return dateString;
            return dateObj.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function previewTTD(event, targetImgId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Img = e.target.result;
                    if (targetImgId === 'outTTDAsmanImg') {
                        ttdAsmanData = base64Img;
                    } else {
                        ttdTLData = base64Img;
                    }
                    saveToLocalStorage();
                    renderAllTables();
                };
                reader.readAsDataURL(file);
            }
        }

        function initDropdown() {
            const select = document.getElementById('selectMaterial');
            select.innerHTML = '';
            masterKatalog.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `[${item.kode}] ${item.uraian}`;
                select.appendChild(opt);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('pln_active_items', JSON.stringify(activeItems));
            
            const formData = {
                nama: document.getElementById('inNama').value,
                lokasi: document.getElementById('inLokasi').value,
                ulp: document.getElementById('inULP').value,
                tanggal: document.getElementById('inTanggal').value,
                asman: document.getElementById('inAsman').value,
                tl: document.getElementById('inTL').value,
                ppn: document.getElementById('selectPPN').value,
                ttdAsman: ttdAsmanData,
                ttdTL: ttdTLData
            };
            localStorage.setItem('pln_form_data', JSON.stringify(formData));
        }

        function loadFromLocalStorage() {
            const savedItems = localStorage.getItem('pln_active_items');
            if (savedItems) {
                try {
                    activeItems = JSON.parse(savedItems);
                } catch (e) {
                    activeItems = [];
                }
            }

            const savedForm = localStorage.getItem('pln_form_data');
            if (savedForm) {
                try {
                    const formData = JSON.parse(savedForm);
                    document.getElementById('inNama').value = formData.nama || '';
                    document.getElementById('inLokasi').value = formData.lokasi || '';
                    document.getElementById('inULP').value = formData.ulp || 'MALANG KOTA';
                    if (formData.tanggal) document.getElementById('inTanggal').value = formData.tanggal;
                    document.getElementById('inAsman').value = formData.asman || 'BAYU KRISTANTO';
                    document.getElementById('inTL').value = formData.tl || 'ARDY NURFIANTO';
                    if (formData.ppn) document.getElementById('selectPPN').value = formData.ppn;
                    ttdAsmanData = formData.ttdAsman || "";
                    ttdTLData = formData.ttdTL || "";
                } catch (e) {
                    // Biarkan default
                }
            }
        }

        function setTodayDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            
            // Set ke input type date format YYYY-MM-DD
            document.getElementById('inTanggal').value = `${yyyy}-${mm}-${dd}`;
            saveToLocalStorage();
        }

        function loadKatalogData() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(function(data) {
                    if (data && data.length > 0) {
                        masterKatalog = data;
                        initDropdown();
                    }
                }).getDbMaterial();
            } else {
                initDropdown();
            }
        }

        function addManualRow() {
            activeItems.push({
                kategori: "SKUTM",
                kode: "",
                uraian: "",
                sat: "M",
                vol: 1,
                harga: 0
            });
            saveToLocalStorage();
            renderAllTables();
        }

        function addItemFromSelect() {
            const selectIdx = document.getElementById('selectMaterial').value;
            if (selectIdx === null || selectIdx === undefined || selectIdx === "") return;
            const katVal = document.getElementById('selectKategori').value;
            const item = masterKatalog[selectIdx];

            activeItems.push({
                kategori: katVal,
                kode: item.kode,
                uraian: item.uraian,
                sat: item.sat,
                vol: 1,
                harga: item.hMat
            });

            if (item.hJasa > 0) {
                activeItems.push({
                    kategori: katVal,
                    kode: item.kode,
                    uraian: `Pemasangan / Jasa ${item.uraian}`,
                    sat: item.sat,
                    vol: 1,
                    harga: item.hJasa
                });
            }

            saveToLocalStorage();
            renderAllTables();
        }

        function updateItemData(index, key, value, renderFull = false) {
            activeItems[index][key] = value;
            saveToLocalStorage();
            if (renderFull) {
                renderAllTables();
            } else {
                updateSingleRowCalculations(index);
                renderRincianPages();
                calculateTotal();
            }
        }

        function updateSingleRowCalculations(index) {
            const item = activeItems[index];
            const hargaSatuan = item.harga || 0;
            const subtotal = (item.vol || 0) * hargaSatuan;
            const subtotalElem = document.getElementById(`subtotal-rekap-${index}`);
            if (subtotalElem) {
                subtotalElem.textContent = formatRupiah(subtotal);
            }
        }

        function renderAllTables() {
            renderRekapPages();
            renderRincianPages();
            calculateTotal();
        }

        /* ------------------- 1. RENDER DINAMIS REKAP RAB ------------------- */
        function renderRekapPages() {
            const container = document.getElementById('rekapPagesContainer');
            if (!container) return;
            container.innerHTML = '';

            if (activeItems.length === 0) {
                container.innerHTML = `<div class="print-page rounded-2xl shadow-xl relative mb-6 border border-slate-200 flex flex-col justify-between">${createRekapPageHTML(0, [], true)}</div>`;
                return;
            }

            const normalPageLimit = 28;
            const lastPageLimit = 22;

            let remainingItems = [...activeItems];
            let startIndex = 0;

            while (remainingItems.length > 0) {
                let currentLimit = (remainingItems.length <= lastPageLimit) ? lastPageLimit : normalPageLimit;
                let pageItems = remainingItems.splice(0, currentLimit);
                let isLastPage = (remainingItems.length === 0);

                const pageDiv = document.createElement('div');
                pageDiv.className = "print-page rounded-2xl shadow-xl relative mb-6 border border-slate-200 flex flex-col justify-between";
                pageDiv.innerHTML = createRekapPageHTML(startIndex, pageItems, isLastPage);
                container.appendChild(pageDiv);

                startIndex += pageItems.length;
            }
        }

        function createRekapPageHTML(startIndex, pageItems, isLastPage) {
            const nama = document.getElementById('inNama').value || "-";
            const lokasi = document.getElementById('inLokasi').value || "-";
            const ulp = document.getElementById('inULP').value || "MALANG KOTA";
            
            const rawTanggal = document.getElementById('inTanggal').value;
            const tglFormatted = getFormattedIndonesianDate(rawTanggal);
            const tgl = "Malang, " + (tglFormatted || "");
            
            const asman = document.getElementById('inAsman').value || "";
            const tl = document.getElementById('inTL').value || "";

            let rowsHTML = '';
            if (pageItems.length === 0) {
                rowsHTML = `<tr><td colspan="9" class="text-center italic py-4 text-slate-400 font-medium bg-slate-50">✨ Belum ada data. Klik "+ Tambah Baris Manual" atau "+ Tambahkan".</td></tr>`;
            } else {
                pageItems.forEach((item, localIdx) => {
                    const idx = startIndex + localIdx;
                    const hargaSatuan = item.harga || 0;
                    const subtotal = (item.vol || 0) * hargaSatuan;

                    if (isPrintMode) {
                        rowsHTML += `
                            <tr>
                                <td class="text-center font-bold">${idx + 1}</td>
                                <td class="text-center font-bold">${item.kategori}</td>
                                <td class="text-center font-mono font-bold">${item.kode || '-'}</td>
                                <td class="text-left">${item.uraian || '-'}</td>

        /* ------------------- 2. RENDER DINAMIS RINCIAN PEKERJAAN ------------------- */
        function renderRincianPages() {
            const container = document.getElementById('rincianPagesContainer');
            if (!container) return;
            container.innerHTML = '';

            let formattedRows = [];
            const kategoriList = ['SUTM', 'SKUTM', 'GTT', 'SUTR'];
            let rowNo = 1;

            kategoriList.forEach(kat => {
                const itemsInKat = activeItems.filter(i => i.kategori === kat);
                if (itemsInKat.length > 0) {
                    formattedRows.push({ isHeader: true, title: `PEKERJAAN ${kat}` });
                    itemsInKat.forEach(item => {
                        formattedRows.push({
                            isHeader: false,
                            no: rowNo++,
                            item: item,
                            origIdx: activeItems.indexOf(item)
                        });
                    });
                }
            });

            if (formattedRows.length === 0) {
                container.innerHTML = `<div class="print-page rounded-2xl shadow-xl relative mb-6 border border-slate-200 flex flex-col justify-between">${createRincianPageHTML([], true)}</div>`;
                return;
            }

            const normalLimit = 28;
            const lastLimit = 22;

            let remainingRows = [...formattedRows];

            while (remainingRows.length > 0) {
                let currentLimit = (remainingRows.length <= lastLimit) ? lastLimit : normalLimit;
                let pageRows = remainingRows.splice(0, currentLimit);
                let isLastPage = (remainingRows.length === 0);

                const pageDiv = document.createElement('div');
                pageDiv.className = "print-page rounded-2xl shadow-xl relative mb-6 border border-slate-200 flex flex-col justify-between";
                pageDiv.innerHTML = createRincianPageHTML(pageRows, isLastPage);
                container.appendChild(pageDiv);
            }
        }

        function createRincianPageHTML(pageRows, isLastPage) {
            const nama = document.getElementById('inNama').value || "-";
            
            const rawTanggal = document.getElementById('inTanggal').value;
            const tglFormatted = getFormattedIndonesianDate(rawTanggal);
            const tgl = "Malang, " + (tglFormatted || "");

            const asman = document.getElementById('inAsman').value || "";
            const tl = document.getElementById('inTL').value || "";

            let tbodyHTML = '';

                tbodyHTML = `<tr><td colspan="7" class="text-center italic py-4 text-slate-400 font-medium bg-slate-50">Belum ada rincian pekerjaan.</td></tr>`;
            } else {
                pageRows.forEach(row => {
                    if (row.isHeader) {
                        tbodyHTML += `<tr class="bg-slate-100 font-bold"><td colspan="7" class="px-2 py-1 text-left uppercase tracking-wider text-[10px] text-slate-800">${row.title}</td></tr>`;
                    } else {
                        const item = row.item;
                        const idx = row.origIdx;
                        const hargaSatuan = item.harga || 0;
                        const totalRow = (item.vol || 0) * hargaSatuan;

                        if (isPrintMode) {
                            tbodyHTML += `
                                <tr>
                                    <td class="text-center">${row.no}</td>
                                    <td class="text-center font-mono">${item.kode || '-'}</td>
                                    <td class="text-left">${item.uraian || '-'}</td>
                                    <td class="text-center">${item.sat || '-'}</td>
                                    <td class="text-center font-bold">${item.vol}</td>
                                    <td class="text-right">${formatAngka(hargaSatuan)}</td>
                                    <td class="text-right font-bold">${formatRupiah(totalRow)}</td>
                                </tr>
                            `;
                        } else {
                            tbodyHTML += `
                                <tr>
                                    <td class="text-center">${row.no}</td>
                                    <td><input type="text" value="${item.kode || ''}" placeholder="Kode" oninput="updateItemData(${idx}, 'kode', this.value)" class="text-center font-mono"></td>
                                    <td><input type="text" value="${item.uraian || ''}" placeholder="Uraian Spesifikasi" oninput="updateItemData(${idx}, 'uraian', this.value)"></td>
                                    <td><input type="text" value="${item.sat || ''}" placeholder="Sat" oninput="updateItemData(${idx}, 'sat', this.value)" class="text-center"></td>
                                    <td><input type="number" inputmode="numeric" pattern="[0-9]*" value="${item.vol}" oninput="updateItemData(${idx}, 'vol', parseFloat(this.value)||0)" class="text-center font-bold"></td>
                                    <td><input type="number" inputmode="numeric" pattern="[0-9]*" value="${hargaSatuan}" placeholder="0" oninput="updateItemData(${idx}, 'harga', parseFloat(this.value)||0)" class="text-right"></td>
                                    <td class="text-right font-bold">${formatRupiah(totalRow)}</td>
                                </tr>
                            `;
                        }
                    }
                });
            }

            let signatureHTML = '';
            if (isLastPage) {
                const asmanImg = ttdAsmanData ? `<img src="${ttdAsmanData}" class="max-h-16 object-contain">` : '';
                const tlImg = ttdTLData ? `<img src="${ttdTLData}" class="max-h-16 object-contain">` : '';

                signatureHTML = `
                    <div class="flex justify-between items-end text-center text-[10px] pt-1 text-black">
                        <div class="w-48 relative">
                            <div class="h-16 flex items-center justify-center">${asmanImg}</div>
                            <p class="font-semibold">ASSISTANT MANAGER PERENCANAAN</p>
                            <p class="font-bold underline">${asman}</p>
                        </div>
                        <div class="w-48 relative">
                            <p class="mb-0.5">${tgl}</p>
                            <div class="h-16 flex items-center justify-center">${tlImg}</div>
                            <p class="font-semibold">TEAM LEADER PERENCANAAN</p>
                            <p class="font-bold underline">${tl}</p>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex-grow flex flex-col justify-start">
                    <div class="flex justify-between items-start border-b-2 border-black pb-1.5 mb-2">
                        <div class="flex items-center gap-3">
                            <svg class="h-9 w-auto" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                                <rect width="300" height="300" fill="#FFF200"/>
                                <path d="M50 120 C 80 100, 120 140, 150 120 C 180 100, 220 140, 250 120 L 250 140 C 220 160, 180 120, 150 140 C 120 160, 80 120, 50 140 Z" fill="#00AEEF"/>
                                <path d="M50 160 C 80 140, 120 180, 150 160 C 180 140, 220 180, 250 160 L 250 180 C 220 200, 180 160, 150 180 C 120 200, 80 160, 50 180 Z" fill="#00AEEF"/>
                                <path d="M50 200 C 80 180, 120 220, 150 200 C 180 180, 220 220, 250 200 L 250 220 C 220 240, 180 200, 150 220 C 120 240, 80 200, 50 220 Z" fill="#00AEEF"/>
                                <polygon points="170,50 120,160 170,140 130,260 210,120 160,135" fill="#ED1C24"/>
                                <text x="150" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#00AEEF" text-anchor="middle">PLN</text>
                            </svg>
                            <div class="text-[9.5px] leading-tight font-bold text-black">
                                PT. PLN (PERSERO)<br>
                                UNIT INDUK DISTRIBUSI JAWA TIMUR<br>
                                UP3 MALANG
                            </div>
                        </div>
                        <div class="text-right text-black">
                            <h2 class="font-bold text-xs underline tracking-wide">RINCIAN PEKERJAAN PERMOHONAN PB/PD</h2>
                            <p class="text-[9px]">A.N. ${nama}</p>
                        </div>
                    </div>

                    <table class="pln-table mb-2">
                        <thead>
                            <tr>
                                <th style="width: 5%;">NO</th>
                                <th style="width: 10%;">KODE</th>
                                <th style="width: 41%;">URAIAN PEKERJAAN / SPESIFIKASI</th>
                                <th style="width: 6%;">SAT</th>
                                <th style="width: 6%;">VOL</th>
                                <th style="width: 16%;">HARGA SATUAN (Rp)</th>
                                <th style="width: 16%;">JUMLAH HARGA (Rp)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tbodyHTML}
                        </tbody>
                    </table>
                </div>

                ${signatureHTML}
            `;
        }

        function getSubtotalPerKategori() {
            let res = { SUTM: 0, SKUTM: 0, GTT: 0, SUTR: 0 };
            activeItems.forEach(item => {
                let kat = item.kategori || 'SKUTM';
                if (res[kat] !== undefined) {
                    res[kat] += (item.vol || 0) * (item.harga || 0);
                }
            });
            return res;
        }

        function deleteRow(index) {
            activeItems.splice(index, 1);
            saveToLocalStorage();
            renderAllTables();
        }

        function cetakPrint() {
            isPrintMode = true;
            renderAllTables();
            
            setTimeout(() => {
                window.print();
                isPrintMode = false;
                renderAllTables();
            }, 100);
        }

        function resetToBlank() {
            activeItems = [];
            ttdAsmanData = "";
            ttdTLData = "";
            
            localStorage.removeItem('pln_active_items');
            localStorage.removeItem('pln_form_data');
            
            document.getElementById('inNama').value = "";
            document.getElementById('inLokasi').value = "";
            document.getElementById('inULP').value = "MALANG KOTA";
            document.getElementById('inAsman').value = "BAYU KRISTANTO";
            document.getElementById('inTL').value = "ARDY NURFIANTO";
            document.getElementById('selectPPN').value = "0.11";
            document.getElementById('imgAsmanTTD').value = "";
            document.getElementById('imgTLTTD').value = "";
            
            setTodayDate();
            syncData();
            renderAllTables();
        }

        function syncData() {
            saveToLocalStorage();
            renderAllTables();
        }

        function calculateTotal() {
            let totalSub = 0;
            activeItems.forEach(item => {
                const hargaSatuan = item.harga || 0;
                totalSub += (item.vol || 0) * hargaSatuan;
            });

            const ppnRate = parseFloat(document.getElementById('selectPPN').value) || 0;
            const ppnPercentText = Math.round(ppnRate * 100);
            
            const labelPPN = document.getElementById('labelPPN');
            if (labelPPN) {
                labelPPN.textContent = ppnRate === 0 ? "PPN (0%):" : `PPN (${ppnPercentText}%):`;
            }

            const ppn = totalSub * ppnRate;
            const grandTotal = totalSub + ppn;
            const pembulatan = Math.round(grandTotal / 1000) * 1000;

            const subTotalElem = document.getElementById('outSubtotal');
            const ppnElem = document.getElementById('outPPN');
            const grandTotalElem = document.getElementById('outGrandTotal');
            const terbilangElem = document.getElementById('outTerbilang');

            if (subTotalElem) subTotalElem.textContent = formatRupiah(totalSub);
            if (ppnElem) ppnElem.textContent = formatRupiah(ppn);
            if (grandTotalElem) grandTotalElem.textContent = formatRupiah(pembulatan);
            if (terbilangElem) terbilangElem.textContent = pembulatan > 0 ? terbilang(pembulatan) + " Rupiah" : "Nihil Rupiah";
        }

        function formatRupiah(num) {
            return "Rp " + Math.round(num).toLocaleString('id-ID');
        }

        function formatAngka(num) {
            return Math.round(num).toLocaleString('id-ID');
        }

        function terbilang(angka) {
            angka = Math.floor(Math.abs(angka));
            const huruf = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            if (angka < 12) return " " + huruf[angka];
            if (angka < 20) return terbilang(angka - 10) + " Belas";
            if (angka < 100) return terbilang(Math.floor(angka / 10)) + " Puluh" + terbilang(angka % 10);
            if (angka < 200) return " Seratus" + terbilang(angka - 100);
            if (angka < 1000) return terbilang(Math.floor(angka / 100)) + " Ratus" + terbilang(angka % 100);
            if (angka < 2000) return " Seribu" + terbilang(angka - 1000);
            if (angka < 1000000) return terbilang(Math.floor(angka / 1000)) + " Ribu" + terbilang(angka % 1000);
            if (angka < 1000000000) return terbilang(Math.floor(angka / 1000000)) + " Juta" + terbilang(angka % 1000000);
            return terbilang(Math.floor(angka / 1000000000)) + " Milyar" + terbilang(angka % 1000000000);
        }

        // Inisialisasi awal saat halaman dimuat
        loadKatalogData();
        loadFromLocalStorage();
        if (!document.getElementById('inTanggal').value) {
            setTodayDate();
        }
        syncData();
        renderAllTables();
    </script>
